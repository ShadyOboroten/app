<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авторизация</title>
    <style>
        *{
            --background: whitesmoke;
            --backgroundForm: white;
            font-size: 20px;
        }
        body{
            background-color: var(--background);
            display: flex;
            place-items: center;
            justify-content: center;
            align-items: center;
        }
        form{
            display: grid;
            background-color: var(--backgroundForm);
            padding: 3rem;
            border-radius: 2.25rem;
            box-shadow: 2px 2px 3px rgb(177, 177, 177);
            
        }
        div{
            margin-bottom: 1rem;

        }
        h1{
            margin-top: 0;
            font-size: 2rem;
        }
        button{
            background-color: rgb(230, 230, 230);
            place-items: center;
            width: 100%;
            padding-top: 0.4rem;
            padding-bottom: 0.4rem;
            border-radius: 0.5rem;
        }
        button:hover{
            transform: translate(-3px, -2px);
            background-color: rgb(214, 214, 214);
            box-shadow: 5px 5px 10px rgb(199, 199, 199);
        }
        button:focus-visible{
            background-color: black;
        }
        input[type="text"],
        input[type="password"],
        textarea {
            width: 96.2%;
            padding: 0.4rem 0.2rem;
            border-radius: 0.6rem;
            border: 2px solid;
        }
    </style>
</head>



<body>
    <form action="autorisation">
        <h1>Авторизация</h1>
        <div>
            <label for="login">Логин</label>
            <input
                id="login"
                name="login"
                type="text"
            />
        </div>
        <div>
            <label for="password">Пароль</label>
            <input 
                id="password"
                name="password"
                type="password"
            />
        </div>
        <button title="Войти">Войти</button>
    </form>
</body>
</html>
